# Quick start:
#   1. cp .env.example .env, then fill in SHEET_ID/SHEET_GID (and anything else you need).
#   2. Drop your Google service-account JSON key into ./secrets/ and point
#      GOOGLE_SERVICE_ACCOUNT_FILE in .env at /app/secrets/<its filename>.
#   3. docker compose up -d --build
# The web UI is then at http://localhost:5000 (or whatever WEBUI_PORT you set).
#
# For a one-off CLI command instead of the web UI:
#   docker compose run --rm kvittomall fetch
#   docker compose run --rm kvittomall status

services:
  kvittomall:
    build: .
    ports:
      - "${WEBUI_PORT:-5000}:${WEBUI_PORT:-5000}"
    env_file:
      - .env
    volumes:
      # Runtime state the pipeline owns and rebuilds itself - see paths.py. Without
      # these, every `docker compose up` would start from a completely empty state.
      - ./data:/app/data
      - ./final:/app/final
      - ./logs:/app/logs
      # Your service-account key(s) - read-only, since nothing here should ever write
      # back into it. GOOGLE_SERVICE_ACCOUNT_FILE in .env should point at
      # /app/secrets/<filename>, matching whatever you dropped in ./secrets/.
      - ./secrets:/app/secrets:ro
      # Web-UI-edited preferences (PDF cover-page layout, sheet column mapping) - a
      # *directory* mount, deliberately, not one bind mount per file: bind-mounting an
      # individual file directly would make every save through the web UI fail outright
      # ("Device or resource busy" - the app writes these atomically via a
      # temp-file-then-rename, and the kernel refuses to rename onto an active
      # bind-mount point). Mounting the containing directory instead sidesteps that
      # entirely, and needs no setup step: an empty/missing host directory is perfectly
      # normal here, since paths.py already treats a missing file inside it as "nothing
      # customized yet." Without this, a container rebuild (not just a restart) loses
      # any /config customization and falls back to the compiled-in defaults.
      - ./config:/app/config
    restart: unless-stopped
